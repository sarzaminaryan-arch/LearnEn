name: Diagnostics

# Temporary workflow: compiles one variant and publishes the compiler output into
# the job summary, because the normal run log is not retrievable from the
# environment this repository is being developed in.
#
# Delete this file once the build is green.

on:
  workflow_dispatch:
  push:
    branches: [arena/60c76440-learnen]

permissions:
  contents: read
  checks: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dorg.gradle.daemon=false
    -Dkotlin.daemon.jvm.options=-Xmx2g

jobs:
  compile:
    name: Compile and report errors
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compile main source set and capture output
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:compileOfflineDebugKotlin --stacktrace --console=plain \
            2>&1 | tee /tmp/compile.log
          echo "gradle exit: $?"

      # The unit tests are a separate compilation unit (and the step that failed
      # in the original workflow), so they have to be compiled and run too.
      - name: Compile and run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testOfflineDebugUnitTest --stacktrace --console=plain \
            2>&1 | tee /tmp/test.log
          echo "gradle exit: $?"

      - name: Extract compiler errors into the summary
        if: always()
        run: |
          {
            echo "## Test output"
            echo ""
            echo '```'
            if [ -f /tmp/test.log ]; then
              grep -E "^e: |FAILED|tests completed|BUILD " /tmp/test.log | head -n 80 || true
            else
              echo "no test.log produced"
            fi
            echo '```'
            echo ""
            echo "## Compiler output"
            echo ""
            echo '```'
            if [ -f /tmp/compile.log ]; then
              # Kotlin errors only: they start with "e: file://"
              grep -E "^e: |^w: .*(Unresolved|deprecat)" /tmp/compile.log | head -n 120 || true
              echo ""
              echo "--- FAILURE / cause lines ---"
              grep -E "FAILURE:|What went wrong|Caused by|> Could not|Unresolved reference" /tmp/compile.log | head -n 40 || true
              echo ""
              echo "--- first 60 lines of the task output ---"
              head -n 60 /tmp/compile.log
            else
              echo "no compile.log produced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also surface the first errors as annotations, which the API can read.
          for log in /tmp/compile.log /tmp/test.log; do
            [ -f "$log" ] || continue
            grep -E "^e: file://" "$log" | head -n 25 | while IFS= read -r line; do
              file=$(echo "$line" | sed -E 's|^e: file://[^/]*/[^/]*/[^/]*/[^/]*/[^/]*/[^/]*/([^:]+):.*|\1|')
              msg=$(echo "$line" | sed -E 's|^e: file://[^ ]* ||')
              echo "::error file=$file::$msg"
            done
          done

          # An assertion failure is not an "e:" line. Name the test and paste the
          # assertion message (the line after it) so it is readable remotely.
          if [ -f /tmp/test.log ]; then
            grep -A3 -E "^.*FAILED$" /tmp/test.log | head -n 90 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Report task result
        run: |
          if grep -qE "^e: file://" /tmp/compile.log 2>/dev/null; then
            echo "Kotlin compilation errors were found (see summary)."
          else
            echo "No Kotlin 'e:' lines; check the FAILURE section for Gradle-level problems."
          fi
