name: Release

# Produces signed release artefacts when signing secrets are configured, and
# unsigned ones otherwise, so the workflow never blocks a maintainer who has not
# set up a keystore yet.
#
# Required repository secrets for signing:
#   KEYSTORE_BASE64     base64 of the .jks file (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
#
# Nothing is ever committed: the keystore is written to a temporary path from the
# secret and removed when the job ends.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      variant:
        description: "Which flavour to build"
        required: true
        default: both
        type: choice
        options: [both, offline, online]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build release artefacts
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Cache Gradle artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-release-${{ runner.os }}-

      - name: Prepare signing material
        id: keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ]; then
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "mode=maintainer" >> "$GITHUB_OUTPUT"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Maintainer keystore decoded."
          else
            # No maintainer keystore configured. A generated one keeps the
            # artefacts installable for testing, but it is NOT suitable for
            # publishing: stores tie future updates to the original key.
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias lexiflash-test \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpassword -keypass testpassword \
              -dname "CN=LexiFlash Test Build, OU=CI, O=LexiFlash, C=IR"
            echo "mode=generated" >> "$GITHUB_OUTPUT"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=testpassword"
              echo "KEY_ALIAS=lexiflash-test"
              echo "KEY_PASSWORD=testpassword"
            } >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret: signed with a throwaway key. The APKs install and can be sideloaded, but a store release needs your own keystore."
          fi

      # The signing variables come from $GITHUB_ENV (set in the previous step).
      # A step-level env block would override them, which is exactly the bug that
      # made the generated key invisible to Gradle.
      - name: Assemble signed release
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.variant || 'both' }}"
          if [ "$TARGET" = "both" ]; then
            gradle :app:bundleOfflineRelease :app:assembleOfflineRelease \
                   :app:bundleOnlineRelease :app:assembleOnlineRelease --stacktrace
          else
            CAPITALISED="$(echo "${TARGET:0:1}" | tr '[:lower:]' '[:upper:]')${TARGET:1}"
            gradle ":app:bundle${CAPITALISED}Release" ":app:assemble${CAPITALISED}Release" --stacktrace
          fi

      - name: Verify the offline release carries no INTERNET permission
        run: |
          set -euo pipefail
          # AGP writes intermediates/merged_manifest/offlineRelease/... ,
          # so the directory name is camel-cased, not lower-cased.
          MANIFEST=$(find app/build/intermediates -ipath "*merged_manifest*offlinerelease*" -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath "*offline*release*" | head -n 1)
          fi
          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not locate the offline release merged manifest"
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::The offline release must not request INTERNET"
            exit 1
          fi
          echo "offline release manifest is clean"

      - name: List artefacts
        run: |
          echo "APKs:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true
          echo "Bundles:"
          find app/build/outputs/bundle -name "*.aab" -exec ls -lh {} \; || true

      - name: Sign-check the produced APKs
        run: |
          set -euo pipefail
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "=== $apk ==="
            if unzip -l "$apk" | grep -q 'META-INF/.*\.\(RSA\|DSA\|EC\)$'; then
              echo "  signed"
            else
              echo "::warning::$apk is unsigned"
            fi
          done

      - name: Upload APKs and bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/bundle/offlineRelease/*.aab
            app/build/outputs/bundle/onlineRelease/*.aab
          if-no-files-found: warn
          retention-days: 90

      - name: Publish a GitHub release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LexiFlash Persian ${{ github.ref_name }}
          # Published, not a draft: the download link is the deliverable.
          draft: false
          generate_release_notes: true
          body: |
            ## LexiFlash Persian ${{ github.ref_name }}

            Two flavours are attached:

            * **offline** - no network permission, no network code, everything bundled.
            * **online** - adds opt-in catalogue download and on-device machine translation.

            Content is derived from [Tatoeba](https://tatoeba.org) under CC BY 2.0 FR
            (parts CC0 1.0). Full attribution is in `docs/CREDITS.csv` and `NOTICE.md`.

            ### Installation

            Download and open the APK on the device. Android will ask you to allow
            installing from this source; that prompt is expected for any app that
            did not come from a store.

            * `app-offline-release.apk` - zero permissions, no network code at all.
            * `app-online-release.apk` - adds `INTERNET` for the opt-in catalogue and
              on-device translation. Its application id ends in `.online`, so both
              flavours can be installed side by side.

            ### Signing

            If this release was built without a `KEYSTORE_BASE64` secret, the APKs are
            signed with a throwaway key generated during the build. They install and
            can be sideloaded, but a store submission needs an APK signed with your
            own keystore, whose fingerprint matches the application id you register.
            See the signing section of `README.md`.

            Not affiliated with TED, Interstellar or any rights holder.
          files: |
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/online/release/*.apk
            app/build/outputs/bundle/offlineRelease/*.aab
            app/build/outputs/bundle/onlineRelease/*.aab

      - name: Remove the decrypted keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
