name: Export release APKs

# The release-assets host is not reachable from everywhere these binaries have
# to be fetched from, so this republishes the assets of a published release on
# an orphan branch, where codeload can serve them as a tarball.
#
# It exists only while a download is needed; the branch and this file are
# removed once the bytes are in hand.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets should be republished"
        required: true
        type: string

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir out
          ls -l out

      - name: Publish them on an orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="dist-${TAG}"
          rm -rf work
          mkdir work
          cd work
          git init -q
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          cp ../out/*.apk .
          ls -l
          git checkout -q -b "$BRANCH"
          git add -A
          git commit -q -m "Release assets for ${TAG}"
          git push -q -f origin "$BRANCH"
          echo "::notice::published to $BRANCH"
          for f in *.apk; do
            echo "::notice::$f $(stat -c%s "$f") bytes"
          done
