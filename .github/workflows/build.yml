name: Build

# Builds every variant, runs the JVM test suite and the deck tool tests, then
# proves the offline flavour carries no INTERNET permission.
#
# Uses the `gradle` binary provided by setup-gradle rather than the wrapper,
# because the repository deliberately contains no gradle-wrapper.jar (text-only
# repository). Run `gradle wrapper --gradle-version 8.7` locally if you prefer
# ./gradlew; see README.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dorg.gradle.daemon=false
    -Dkotlin.daemon.jvm.options=-Xmx2g
  PYTHONUNBUFFERED: "1"

jobs:
  android:
    name: Android ${{ matrix.flavor }} ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, online]
        variant: [Debug, Release]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Cache Kotlin and Gradle artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # A silent dependency-resolution failure is the most common CI surprise,
      # so report versions before compiling anything.
      - name: Print toolchain versions
        run: |
          java -version
          gradle --version

      - name: Unit tests
        run: |
          set +e
          gradle :app:test${{ matrix.flavor }}${{ matrix.variant }}UnitTest --stacktrace > test-output.txt 2>&1
          STATUS=$?
          cat test-output.txt
          # Mirror failures as annotations so they are readable without the log.
          grep -A3 'FAILED$' test-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          # Kotlin reports "e: file:///path/File.kt:12:34 message"; turn each into
          # an annotation carrying the real file path and message.
          grep -o 'e: file://[^ ]*' test-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          grep -E '^e: |error: ' test-output.txt | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          exit $STATUS

      - name: Assemble ${{ matrix.flavor }} ${{ matrix.variant }}
        run: |
          set +e
          gradle :app:assemble${{ matrix.flavor }}${{ matrix.variant }} --stacktrace > assemble-output.txt 2>&1
          STATUS=$?
          tail -n 200 assemble-output.txt
          grep -o 'e: file://[^ ]*' assemble-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          grep -E '^e: |^\* What went wrong|^> ' assemble-output.txt | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          exit $STATUS

      # The merged-manifest path changes between AGP versions, so it is located
      # rather than hard-coded. Checking the merged manifest (not the source one)
      # is what actually proves no dependency smuggled a permission in.
      - name: Verify the offline flavour has no INTERNET permission
        if: matrix.flavor == 'offline'
        run: |
          set -euo pipefail
          VARIANT="${{ matrix.variant }}"
          LOWER=$(echo "$VARIANT" | tr '[:upper:]' '[:lower:]')
          # AGP writes intermediates/merged_manifest/offlineDebug/... — the variant
          # camel-case matters because fusebox lower-cases the whole path.
          CAPITAL=$(echo "${LOWER:0:1}" | tr '[:lower:]' '[:upper:]')${LOWER:1}
          MANIFEST=$(find app/build/intermediates -ipath "*merged_manifest*offline${CAPITAL}*" -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath "*offline*" | grep -i "${LOWER}" | head -n 1)
          fi
          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not locate the merged manifest for offline${VARIANT}"
            find app/build/intermediates -name AndroidManifest.xml | head -n 20 || true
            exit 1
          fi
          echo "Checking $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::The offline flavour must not request INTERNET"
            exit 1
          fi
          if grep -Eq 'android.permission.(READ|WRITE)_EXTERNAL_STORAGE|READ_MEDIA_' "$MANIFEST"; then
            echo "::error::A storage permission was merged in; imports must use SAF only"
            exit 1
          fi
          if grep -Eq 'ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE' "$MANIFEST"; then
            echo "::error::A network-state permission was merged into the offline build"
            exit 1
          fi
          echo "offline manifest is clean"

      - name: Verify the online flavour does request INTERNET
        if: matrix.flavor == 'online'
        run: |
          set -euo pipefail
          LOWER=$(echo "${{ matrix.variant }}" | tr '[:upper:]' '[:lower:]')
          CAPITAL=$(echo "${LOWER:0:1}" | tr '[:lower:]' '[:upper:]')${LOWER:1}
          MANIFEST=$(find app/build/intermediates -ipath "*merged_manifest*online${CAPITAL}*" -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath "*online*" | grep -i "${LOWER}" | head -n 1)
          fi
          if [ -z "$MANIFEST" ]; then
            echo "::error::Could not locate the merged manifest for online${{ matrix.variant }}"
            exit 1
          fi
          echo "Checking $MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo "::error::The online flavour should request INTERNET"
            exit 1
          }

      - name: Collect APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.variant == 'Debug' && 'debug' || 'release' }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.flavor }}-${{ matrix.variant }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  deck-tool:
    name: Deck tool
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pytest

      # The sample deck is deliberately small (30 hand-written cards in 3 parts),
      # so it is validated structurally without the shipped-deck size minimums.
      - name: Verify the committed sample deck is valid
        run: python tools/validate_deck.py --allow-small app/src/main/assets/content/sample_deck.json

      - name: Run deck tool tests
        run: python -m pytest tools -q

      - name: Build a small deck from Tatoeba (network)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python tools/build_deck.py \
            --out build/generated/core_deck.json \
            --credits build/generated/CREDITS.csv \
            --cache-dir build/tatoeba \
            --target-cards 3000 \
            --parts 10
          python tools/validate_deck.py build/generated/core_deck.json

      - name: Note when the network build fell back to the sample deck
        run: |
          if [ ! -f build/generated/core_deck.json ]; then
            echo "::warning::Tatoeba was unreachable; the app will use the bundled sample deck."
          fi

      - name: Upload the generated deck
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-deck
          path: |
            build/generated/core_deck.json
            build/generated/CREDITS.csv
          if-no-files-found: ignore
          retention-days: 30
