name: Build

# Build and publish Debug and Release APKs independently. An assemble/test failure
# in one job cannot prevent the other build type from uploading its APK.
# Uses setup-gradle's Gradle binary because the repository intentionally omits
# the binary Gradle wrapper JAR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dorg.gradle.daemon=false
    -Dkotlin.daemon.jvm.options=-Xmx2g
  PYTHONUNBUFFERED: "1"

jobs:
  android-debug:
    name: Android ${{ matrix.flavor }} Debug
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, online]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Assemble ${{ matrix.flavor }} Debug
        run: |
          set +e
          gradle ":app:assemble${{ matrix.flavor == 'offline' && 'Offline' || 'Online' }}Debug" --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"
          gradle_status=${PIPESTATUS[0]}
          set -e
          if [ "$gradle_status" -ne 0 ]; then
            diagnostics=$(grep -iE '(^e:|error:|unresolved reference|type mismatch|overload resolution|expecting |compilation error|^FAILURE:|What went wrong|Could not resolve|cannot access|not enough information to infer|too many arguments)' "$RUNNER_TEMP/gradle-assemble.log" | tail -n 30 || true)
            if [ -n "$diagnostics" ]; then
              printf '%s\n' "$diagnostics" | while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%25}"
              done
            else
              tail -n 30 "$RUNNER_TEMP/gradle-assemble.log" | while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%25}"
              done
            fi
          fi
          exit "$gradle_status"

      # Keep this immediately after assemble and unconditional: later checks must
      # not withhold an APK that was successfully produced.
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-Debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Unit tests
        run: gradle ":app:test${{ matrix.flavor == 'offline' && 'Offline' || 'Online' }}DebugUnitTest" --stacktrace

      - name: Verify offline Debug manifest has no network or storage permissions
        if: matrix.flavor == 'offline'
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -ipath '*merged_manifest*offlineDebug*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath '*offline*' | grep -i debug | head -n 1)
          fi
          test -n "$MANIFEST" || { echo '::error::offline Debug merged manifest not found'; exit 1; }
          echo "Checking $MANIFEST"
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_)' "$MANIFEST"; then
            echo '::error::offline Debug merged a network or storage permission'
            exit 1
          fi

      - name: Verify online Debug manifest requests INTERNET
        if: matrix.flavor == 'online'
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -ipath '*merged_manifest*onlineDebug*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath '*online*' | grep -i debug | head -n 1)
          fi
          test -n "$MANIFEST" || { echo '::error::online Debug merged manifest not found'; exit 1; }
          echo "Checking $MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo '::error::online Debug should request INTERNET'
            exit 1
          }

      - name: Upload Debug test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.flavor }}-Debug
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  android-release:
    name: Android ${{ matrix.flavor }} Release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, online]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Prepare temporary debug signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-debug.jks"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=androiddebugkey"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Assemble ${{ matrix.flavor }} Release
        run: |
          set +e
          gradle ":app:assemble${{ matrix.flavor == 'offline' && 'Offline' || 'Online' }}Release" --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"
          gradle_status=${PIPESTATUS[0]}
          set -e
          if [ "$gradle_status" -ne 0 ]; then
            diagnostics=$(grep -iE '(^e:|error:|unresolved reference|type mismatch|overload resolution|expecting |compilation error|^FAILURE:|What went wrong|Could not resolve|cannot access|not enough information to infer|too many arguments)' "$RUNNER_TEMP/gradle-assemble.log" | tail -n 30 || true)
            if [ -n "$diagnostics" ]; then
              printf '%s\n' "$diagnostics" | while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%25}"
              done
            else
              tail -n 30 "$RUNNER_TEMP/gradle-assemble.log" | while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%25}"
              done
            fi
          fi
          exit "$gradle_status"

      # Upload even when assemble failed (to report a missing APK) and before any
      # unit-test or manifest check can fail.
      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-Release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Unit tests
        run: gradle ":app:test${{ matrix.flavor == 'offline' && 'Offline' || 'Online' }}ReleaseUnitTest" --stacktrace

      - name: Verify offline Release manifest has no network or storage permissions
        if: matrix.flavor == 'offline'
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -ipath '*merged_manifest*offlineRelease*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath '*offline*' | grep -i release | head -n 1)
          fi
          test -n "$MANIFEST" || { echo '::error::offline Release merged manifest not found'; exit 1; }
          echo "Checking $MANIFEST"
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_)' "$MANIFEST"; then
            echo '::error::offline Release merged a network or storage permission'
            exit 1
          fi

      - name: Verify online Release manifest requests INTERNET
        if: matrix.flavor == 'online'
        run: |
          set -euo pipefail
          MANIFEST=$(find app/build/intermediates -ipath '*merged_manifest*onlineRelease*' -name AndroidManifest.xml | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find app/build/intermediates -name AndroidManifest.xml -ipath '*online*' | grep -i release | head -n 1)
          fi
          test -n "$MANIFEST" || { echo '::error::online Release merged manifest not found'; exit 1; }
          echo "Checking $MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo '::error::online Release should request INTERNET'
            exit 1
          }

      - name: Upload Release test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.flavor }}-Release
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  deck-tool:
    name: Deck tool
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pytest

      - name: Verify the committed sample deck is valid
        run: python tools/validate_deck.py --allow-small app/src/main/assets/content/sample_deck.json

      - name: Run deck tool tests
        run: python -m pytest tools -q

      - name: Build a small deck from Tatoeba (network)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python tools/build_deck.py \
            --out build/generated/core_deck.json \
            --credits build/generated/CREDITS.csv \
            --cache-dir build/tatoeba \
            --target-cards 3000 \
            --parts 10
          python tools/validate_deck.py build/generated/core_deck.json

      - name: Note when the network build fell back to the sample deck
        run: |
          if [ ! -f build/generated/core_deck.json ]; then
            echo "::warning::Tatoeba was unreachable; the app will use the bundled sample deck."
          fi

      - name: Upload the generated deck
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generated-deck
          path: |
            build/generated/core_deck.json
            build/generated/CREDITS.csv
          if-no-files-found: ignore
          retention-days: 30
