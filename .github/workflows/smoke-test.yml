name: Smoke test on an emulator

# Answers one question the rest of CI cannot: does the app actually start?
# Every other job only compiles, so a startup crash can ship. This boots an
# emulator, installs the build, launches it, and prints the real trace if it
# dies.
#
# Interpreter note: the emulator action runs `script` via `sh -c`, and /bin/sh
# is dash on Ubuntu. dash rejects `set -o pipefail` with exit code 2 before the
# first line of output, which is why earlier runs of this workflow failed with
# a bare "exit code 2" and no diagnostics. The checks therefore live in
# scripts/smoke-test.sh, which the shell merely invokes.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant to launch"
        required: true
        default: release
        type: choice
        options: [release, debug]
      flavor:
        description: "Which flavour to smoke-test"
        required: true
        default: offline
        type: choice
        options: [offline, online]

permissions:
  contents: read

jobs:
  smoke:
    name: Launch ${{ inputs.flavor }} ${{ inputs.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # adb refuses an unsigned APK, and the release build type only attaches a
      # signingConfig when one is configured.
      - name: Prepare a throwaway signing key
        if: inputs.variant == 'release'
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/smoke.jks" \
            -alias smoke \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass smokepass -keypass smokepass \
            -dname "CN=Smoke Test, O=LexiFlash, C=IR"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/smoke.jks"
            echo "KEYSTORE_PASSWORD=smokepass"
            echo "KEY_ALIAS=smoke"
            echo "KEY_PASSWORD=smokepass"
          } >> "$GITHUB_ENV"

      - name: Assemble the ${{ inputs.variant }} build
        run: |
          set -euo pipefail
          FLAVOR="${{ inputs.flavor }}"
          CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          VARIANT="${{ inputs.variant }}"
          VARTITLE="$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          gradle ":app:assemble${CAP}${VARTITLE}" --stacktrace

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke-test.sh
