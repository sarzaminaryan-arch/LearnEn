name: Smoke test on an emulator

# Answers one question the rest of CI cannot: does the app actually start?
# Every other job only compiles, so a startup crash could ship. This boots an
# emulator, installs the APK and fails with the real trace if the app dies.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which flavour to smoke-test"
        required: true
        default: offline
        type: choice
        options: [offline, online]

permissions:
  contents: read

jobs:
  smoke:
    name: Launch ${{ inputs.flavor }} build
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble the debug-signed release build
        run: gradle :app:assemble${{ inputs.flavor == 'offline' && 'Offline' || 'Online' }}Debug --stacktrace

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            echo "Installing $APK"
            adb install -r "$APK"

            # The debug build carries an applicationIdSuffix, so the component
            # has to be read from the APK rather than assumed.
            PKG=$(aapt dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            echo "Package: $PKG"
            adb logcat -c
            adb shell am start -W -n "$PKG/.MainActivity"
            # Give Compose time to settle and the warm-up to finish.
            sleep 25
            echo "=== is the process still alive? ==="
            if adb shell pidof "$PKG" > /dev/null; then
              echo "ALIVE"
            else
              echo "::error::the app process is gone; it crashed on launch"
              echo "=== crash trace ==="
              adb logcat -d -b crash
              echo "=== relevant logcat ==="
              adb logcat -d | grep -i -E "lexiflash|AndroidRuntime|FATAL" | tail -n 120
              exit 1
            fi
            echo "=== foreground activity ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -5
            echo "=== any FATAL in the buffer? ==="
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              echo "::error::a fatal exception was logged"
              adb logcat -d | grep -A 30 "FATAL EXCEPTION" | head -n 80
              exit 1
            fi
            echo "=== app log ==="
            adb logcat -d | grep -i -E "lexiflash|AndroidRuntime" | tail -n 60
