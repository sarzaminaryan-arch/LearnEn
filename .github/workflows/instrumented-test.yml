name: Instrumented import and catalogue tests

# Runs the real androidTest suite against minified release APKs on both the
# minimum supported API and a current API, for both distribution flavours.
# Reports and logcat are published as artifacts and workflow annotations.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    name: ${{ matrix.flavor }} release · API ${{ matrix.api_level }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, online]
        api_level: [24, 34]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Create temporary signing key for release test APK
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/instrumented.jks" \
            -alias instrumented \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass instrumentedpass -keypass instrumentedpass \
            -dname "CN=Instrumented Test, O=LexiFlash, C=DE"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/instrumented.jks"
            echo "KEYSTORE_PASSWORD=instrumentedpass"
            echo "KEY_ALIAS=instrumented"
            echo "KEY_PASSWORD=instrumentedpass"
          } >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on API ${{ matrix.api_level }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VARIANT: release
          FLAVOR: ${{ matrix.flavor }}
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: bash scripts/instrumented-test.sh

      - name: Upload full test report and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.flavor }}-api${{ matrix.api_level }}
          path: instrumented-report.txt
          if-no-files-found: warn
          retention-days: 14
