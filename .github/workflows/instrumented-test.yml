name: Instrumented tests on an emulator

# Runs the androidTest suite, which is the only place the catalogue and import
# screens are actually rendered and measured.
#
# The smoke test proves the app starts. It does not open a second screen, so a
# layout crash inside the catalogue or the import wizard sails straight past it.
# That is exactly the gap the device report exposed.
#
# Interpreter note: the emulator action runs its `script` input through
# `sh -c`, and /bin/sh is dash on Ubuntu, where `set -o pipefail` is fatal. The
# work therefore lives in scripts/instrumented-test.sh, which the action merely
# invokes with bash.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant to test"
        required: true
        default: debug
        type: choice
        options: [debug]
      flavor:
        description: "Which flavour to test"
        required: true
        default: offline
        type: choice
        options: [offline, online]

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}-${{ inputs.flavor }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: androidTest ${{ inputs.flavor }} ${{ inputs.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VARIANT: ${{ inputs.variant }}
          FLAVOR: ${{ inputs.flavor }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: bash scripts/instrumented-test.sh

      # The job log is not readable from where this needs to be diagnosed, and
      # the artifact API redirects to a host that is unreachable, so the report
      # is republished as annotations by the script itself.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ inputs.flavor }}-${{ inputs.variant }}
          path: |
            instrumented-report.txt
            **/instrumented-report.txt
          if-no-files-found: warn
          retention-days: 14
