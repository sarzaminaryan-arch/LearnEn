name: Instrumented navigation and import tests

# Run the real Activity/navigation UI suite on unminified Debug APKs for both
# distribution flavors and the minimum/current Android API levels.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    name: ${{ matrix.flavor }} Debug · API ${{ matrix.api_level }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, online]
        api_level: [24, 34]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on API ${{ matrix.api_level }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VARIANT: debug
          FLAVOR: ${{ matrix.flavor }}
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: bash scripts/instrumented-test.sh

      - name: Upload report, complete logcat, crash buffer and Gradle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report-${{ matrix.flavor }}-api${{ matrix.api_level }}
          path: |
            instrumented-report.txt
            instrumented-logcat.txt
            instrumented-crash.txt
            instrumented-failure.txt
            gradle-test.log
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14
